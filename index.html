<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMLFS Sales Command Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #0f1117;
            color: #e6edf3;
            padding: 20px;
        }
        .container { max-width: 1600px; margin: 0 auto; }

        .header {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .header h1 { font-size: 28px; font-weight: 600; margin-bottom: 8px; }
        .header-meta {
            display: flex; justify-content: space-between; align-items: center;
            margin-top: 12px; font-size: 14px; opacity: 0.95;
        }

        .kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background-color: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 24px;
            transition: all 0.3s ease;
        }
        .kpi-card:hover { border-color: #6366f1; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2); }
        .kpi-label {
            font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;
            color: #8b949e; margin-bottom: 8px; font-weight: 600;
        }
        .kpi-value { font-size: 32px; font-weight: 700; color: #60a5fa; margin-bottom: 8px; }
        .kpi-period { font-size: 11px; color: #6e7681; margin-bottom: 8px; }
        .kpi-subtext { font-size: 13px; color: #79c0ff; font-weight: 500; }

        .section {
            background-color: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .section-title {
            font-size: 16px; font-weight: 600; margin-bottom: 20px;
            color: #e6edf3; border-bottom: 1px solid #2a2d3a; padding-bottom: 12px;
        }

        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
            gap: 24px;
        }
        .chart-container {
            background-color: #161922;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 20px;
        }
        .chart-container h3 {
            font-size: 14px; font-weight: 600; color: #79c0ff; margin-bottom: 16px;
        }
        .chart-canvas { max-height: 300px; }

        /* YTD Progress Bar */
        .ytd-bar-container {
            background-color: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .ytd-bar-header {
            display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;
        }
        .ytd-bar-title { font-size: 16px; font-weight: 600; color: #e6edf3; }
        .ytd-bar-value { font-size: 24px; font-weight: 700; color: #60a5fa; }
        .ytd-bar-track {
            height: 32px; background-color: #2a2d3a; border-radius: 6px; overflow: visible;
            position: relative;
        }
        .ytd-bar-fill {
            height: 100%; border-radius: 6px; transition: width 1s ease;
            display: flex; align-items: center; justify-content: flex-end; padding-right: 12px;
            font-size: 12px; font-weight: 700; color: #fff;
        }

        .month-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 30px;
        }
        .month-card {
            background-color: #1a1d27;
            border: 1px solid #2a2d3a;
            border-radius: 8px;
            padding: 16px 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .month-card.active { border-color: #6366f1; background-color: #1e2136; }
        .month-card.hit { border-color: #52B788; }
        .month-card.miss { border-color: #f85149; }
        .month-card.future { opacity: 0.4; }
        .month-card .month-name { font-size: 11px; color: #8b949e; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
        .month-card .month-value { font-size: 18px; font-weight: 700; color: #e6edf3; }
        .month-card .month-pct { font-size: 11px; font-weight: 600; margin-top: 4px; }
        .month-card .month-pct.hit { color: #52B788; }
        .month-card .month-pct.miss { color: #f85149; }
        .month-card .month-pct.pending { color: #6e7681; }

        table { width: 100%; border-collapse: collapse; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; color: #8b949e; padding: 10px 12px; text-align: left; border-bottom: 1px solid #2a2d3a; font-weight: 600; }
        td { padding: 10px 12px; border-bottom: 1px solid #1e2130; font-size: 13px; }
        .text-right { text-align: right; }
        .currency { font-variant-numeric: tabular-nums; }

        .rag-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
        .rag-dot.green { background-color: #52B788; }
        .rag-dot.amber { background-color: #fbbf24; }
        .rag-dot.red { background-color: #f85149; }

        .updated-stamp { text-align: center; padding: 20px; font-size: 12px; color: #6e7681; }
    </style>
</head>
<body>
<div class="container">

    <div class="header">
        <h1>RMLFS Sales Command Center</h1>
        <div class="header-meta">
            <span>FY 26/27 | £13M Annual Target</span>
            <span id="headerDate">Loading...</span>
        </div>
    </div>

    <div class="kpi-row" id="kpiRow"></div>

    <!-- YTD Progress Bar -->
    <div class="ytd-bar-container">
        <div class="ytd-bar-header">
            <span class="ytd-bar-title">Year-to-Date Progress — £13M Target</span>
            <span class="ytd-bar-value" id="ytdValue">—</span>
        </div>
        <div class="ytd-bar-track">
            <div class="ytd-bar-fill" id="ytdFill" style="width: 0%; background: linear-gradient(90deg, #6366f1, #818cf8);">—</div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-top:8px; font-size:10px; color:#6e7681; text-transform:uppercase; letter-spacing:0.5px;" id="ytdMonths"></div>
    </div>

    <!-- Month Cards -->
    <div class="month-cards" id="monthCards"></div>

    <!-- Charts -->
    <div class="section">
        <h2 class="section-title">Current Month Breakdown</h2>
        <div class="chart-grid">
            <div class="chart-container">
                <h3 id="chartWorkMixTitle">Work Mix</h3>
                <canvas id="workMixChart" class="chart-canvas"></canvas>
            </div>
            <div class="chart-container">
                <h3>Monthly Actual vs Target</h3>
                <canvas id="monthlyChart" class="chart-canvas"></canvas>
            </div>
        </div>
    </div>

    <!-- Band Analysis -->
    <div class="section">
        <h2 class="section-title" id="bandTableTitle">Band Analysis</h2>
        <table id="bandTable">
            <thead>
                <tr>
                    <th>Band</th>
                    <th class="text-right">Target</th>
                    <th class="text-right">Won</th>
                    <th class="text-right">Deals</th>
                    <th class="text-right">% Target</th>
                    <th class="text-right">RAG</th>
                </tr>
            </thead>
            <tbody id="bandTableBody"></tbody>
        </table>
    </div>

    <!-- Top Wins -->
    <div class="section">
        <h2 class="section-title" id="topWinsTitle">Top Wins</h2>
        <table>
            <thead>
                <tr>
                    <th>Deal</th>
                    <th>Client</th>
                    <th class="text-right">Value</th>
                </tr>
            </thead>
            <tbody id="topWinsBody"></tbody>
        </table>
    </div>

    <div class="updated-stamp" id="updatedStamp">Last updated: —</div>
</div>

<script>
// ============================================================
// RMLFS SALES COMMAND CENTER — CONFIG & DATA
// The MONTHLY_DATA block below is the ONLY part that changes.
// Each month, a new entry is added by the scheduled refresh task.
// ============================================================
const CONFIG = {
    annualTarget: 13000000,
    monthlyTarget: 1083333,
    fyMonths: ['Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb'],
    fyMonthKeys: ['2026-03','2026-04','2026-05','2026-06','2026-07','2026-08','2026-09','2026-10','2026-11','2026-12','2027-01','2027-02'],
};

const MONTHLY_DATA = {
    '2026-03': {
        revenue: 1098991,
        deals: 249,
        topWins: [
            { name: 'Poplar London Block B & C', client: 'Trigon DM Limited', value: 245526 },
            { name: 'Orwell Park School', client: 'Direct', value: 198733 },
            { name: 'Lowbridge Court', client: 'MPB', value: 130189 },
            { name: 'Go Outdoors Chesterfield', client: 'JD Sports', value: 60114 },
            { name: 'Henfield Leisure Centre', client: 'Direct', value: 47588 },
            { name: 'Virgin Active Northampton', client: 'Direct', value: 32943 },
        ],
        workMix: {
            Projects: { value: 715000, deals: 7 },
            Jobs: { value: 188000, deals: 38 },
            Callouts: { value: 133000, deals: 153 },
            'Gutter Cleans': { value: 49000, deals: 82 },
        },
        bands: {
            'Micro (<£1K)': { target: 145000, won: 133200, deals: 163 },
            'Small (£1-5K)': { target: 180000, won: 95400, deals: 42 },
            'Medium (£5-25K)': { target: 260000, won: 119600, deals: 12 },
            'Large (£25-100K)': { target: 200000, won: 113100, deals: 3 },
            'Major (>£100K)': { target: 298000, won: 574700, deals: 3 },
        },
        generated: '2026-03-31T19:30:00Z'
    },
    // NEXT MONTH ENTRY WILL BE ADDED HERE BY SCHEDULED TASK:
    // '2026-04': { revenue: ..., deals: ..., topWins: [...], workMix: {...}, bands: {...}, generated: '...' },
};

// ============================================================
// RENDERING ENGINE — don't edit below this line
// ============================================================
function fmt(v) {
    if (v >= 1000000) return '\u00A3' + (v / 1000000).toFixed(1) + 'M';
    if (v >= 1000) return '\u00A3' + Math.round(v / 1000).toLocaleString() + 'K';
    return '\u00A3' + v.toLocaleString();
}

function getYTD() {
    let total = 0, deals = 0;
    for (const key of CONFIG.fyMonthKeys) {
        if (MONTHLY_DATA[key]) { total += MONTHLY_DATA[key].revenue; deals += MONTHLY_DATA[key].deals; }
    }
    return { total, deals };
}

function getLatestMonth() {
    let latest = null;
    for (const key of CONFIG.fyMonthKeys) { if (MONTHLY_DATA[key]) latest = key; }
    return latest;
}

function render() {
    const latestKey = getLatestMonth();
    const latestData = MONTHLY_DATA[latestKey];
    const ytd = getYTD();
    const monthsComplete = Object.keys(MONTHLY_DATA).length;
    const runRateTarget = monthsComplete * CONFIG.monthlyTarget;
    const runRateDiff = ytd.total - runRateTarget;
    const ytdPct = ((ytd.total / CONFIG.annualTarget) * 100).toFixed(1);
    const latestPct = latestData ? ((latestData.revenue / CONFIG.monthlyTarget) * 100).toFixed(0) : 0;
    const latestHit = latestData && latestData.revenue >= CONFIG.monthlyTarget;
    const latestIdx = CONFIG.fyMonthKeys.indexOf(latestKey);
    const latestLabel = CONFIG.fyMonths[latestIdx] || '';

    document.getElementById('headerDate').textContent = 'Latest: ' + latestLabel + ' 2026 | Updated ' + new Date().toLocaleDateString('en-GB');

    // KPIs
    const hit = '#52B788', miss = '#f85149';
    const lc = latestHit ? hit : miss;
    const rc = runRateDiff >= 0 ? hit : miss;
    document.getElementById('kpiRow').innerHTML = `
        <div class="kpi-card" style="border-color:${lc}">
            <div class="kpi-label">Revenue Won (${latestLabel})</div>
            <div class="kpi-value" style="color:${lc}">${fmt(latestData.revenue)}</div>
            <div class="kpi-period">${latestData.deals} deals closed</div>
            <div class="kpi-subtext" style="color:${lc}">${latestHit?'▲':'▼'} ${latestPct}% of ${fmt(CONFIG.monthlyTarget)} target — ${latestHit?'HIT':'MISSED'}</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">FY 26/27 YTD</div>
            <div class="kpi-value">${fmt(ytd.total)}</div>
            <div class="kpi-period">${ytd.deals} total deals</div>
            <div class="kpi-subtext">${monthsComplete} of 12 months complete</div>
        </div>
        <div class="kpi-card" style="border-color:${rc}">
            <div class="kpi-label">Annual Target</div>
            <div class="kpi-value" style="color:${rc}">\u00A313.0M</div>
            <div class="kpi-period">Full Year Target</div>
            <div class="kpi-subtext" style="color:${rc}">${runRateDiff>=0?'▲':'▼'} ${fmt(Math.abs(runRateDiff))} ${runRateDiff>=0?'ahead of':'behind'} run-rate after Month ${monthsComplete}</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Run Rate (Annualised)</div>
            <div class="kpi-value">${fmt(ytd.total / monthsComplete * 12)}</div>
            <div class="kpi-period">Based on ${monthsComplete} month${monthsComplete>1?'s':''}</div>
            <div class="kpi-subtext">${((ytd.total / monthsComplete * 12 / CONFIG.annualTarget) * 100).toFixed(0)}% of \u00A313M on current pace</div>
        </div>
    `;

    // YTD bar
    document.getElementById('ytdValue').textContent = fmt(ytd.total) + ' / \u00A313M (' + ytdPct + '%)';
    const fill = document.getElementById('ytdFill');
    fill.style.width = Math.min(parseFloat(ytdPct), 100) + '%';
    fill.textContent = ytdPct + '%';
    document.getElementById('ytdMonths').innerHTML = CONFIG.fyMonths.map(m => '<span>'+m+'</span>').join('');

    // Month cards
    document.getElementById('monthCards').innerHTML = CONFIG.fyMonthKeys.map((key, i) => {
        const d = MONTHLY_DATA[key];
        const active = key === latestKey;
        let cls = 'month-card', val = '\u2014', pct = '', pcls = 'pending';
        if (d) {
            const p = ((d.revenue / CONFIG.monthlyTarget) * 100).toFixed(0);
            val = fmt(d.revenue); pct = p + '%';
            pcls = d.revenue >= CONFIG.monthlyTarget ? 'hit' : 'miss';
            cls += d.revenue >= CONFIG.monthlyTarget ? ' hit' : ' miss';
        } else { cls += ' future'; }
        if (active) cls += ' active';
        return '<div class="'+cls+'"><div class="month-name">'+CONFIG.fyMonths[i]+'</div><div class="month-value">'+val+'</div><div class="month-pct '+pcls+'">'+pct+'</div></div>';
    }).join('');

    // Work Mix donut
    if (latestData.workMix) {
        document.getElementById('chartWorkMixTitle').textContent = latestLabel + ' Work Mix';
        const wm = latestData.workMix;
        new Chart(document.getElementById('workMixChart'), {
            type: 'doughnut',
            data: { labels: Object.keys(wm), datasets: [{ data: Object.values(wm).map(v=>v.value), backgroundColor: ['#6366f1','#3b82f6','#10b981','#f59e0b'], borderWidth: 0 }] },
            options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#8b949e', padding: 16 } }, tooltip: { callbacks: { label: c => c.label+': '+fmt(c.raw) } } } }
        });
    }

    // Monthly bar chart
    const mLabels = [], mActuals = [], mTargets = [];
    CONFIG.fyMonthKeys.forEach((key, i) => {
        mLabels.push(CONFIG.fyMonths[i]);
        mActuals.push(MONTHLY_DATA[key] ? MONTHLY_DATA[key].revenue : 0);
        mTargets.push(CONFIG.monthlyTarget);
    });
    new Chart(document.getElementById('monthlyChart'), {
        type: 'bar',
        data: {
            labels: mLabels,
            datasets: [
                { label: 'Actual', data: mActuals, backgroundColor: mActuals.map((a,i) => !MONTHLY_DATA[CONFIG.fyMonthKeys[i]] ? '#2a2d3a' : a >= CONFIG.monthlyTarget ? '#52B788' : '#f85149'), borderRadius: 4 },
                { label: 'Target', data: mTargets, backgroundColor: 'transparent', borderColor: '#fbbf24', borderWidth: 2, borderDash: [6,3], type: 'line', pointRadius: 0, fill: false }
            ]
        },
        options: {
            responsive: true,
            scales: { y: { beginAtZero: true, ticks: { color: '#6e7681', callback: v => fmt(v) }, grid: { color: '#1e2130' } }, x: { ticks: { color: '#8b949e' }, grid: { display: false } } },
            plugins: { legend: { labels: { color: '#8b949e' } }, tooltip: { callbacks: { label: c => c.dataset.label+': '+fmt(c.raw) } } }
        }
    });

    // Band table
    if (latestData.bands) {
        document.getElementById('bandTableTitle').textContent = latestLabel + ' Band Analysis';
        const tb = document.getElementById('bandTableBody');
        let tT=0, tW=0, tD=0, rows='';
        for (const [b,d] of Object.entries(latestData.bands)) {
            const p = d.target>0 ? ((d.won/d.target)*100).toFixed(0) : 0;
            const rc = p>=100?'green':p>=75?'amber':'red';
            tT+=d.target; tW+=d.won; tD+=d.deals;
            rows += `<tr><td>${b}</td><td class="text-right currency">${fmt(d.target)}</td><td class="text-right currency">${fmt(d.won)}</td><td class="text-right">${d.deals}</td><td class="text-right" style="color:${p>=100?'#52B788':p>=75?'#fbbf24':'#f85149'};font-weight:600">${p}%</td><td class="text-right"><span class="rag-dot ${rc}"></span></td></tr>`;
        }
        const tp = tT>0?((tW/tT)*100).toFixed(0):0;
        rows += `<tr style="background:rgba(99,102,241,0.1);font-weight:600"><td>TOTAL</td><td class="text-right currency">${fmt(tT)}</td><td class="text-right currency">${fmt(tW)}</td><td class="text-right">${tD}</td><td class="text-right" style="color:${tp>=100?'#52B788':'#f85149'};font-weight:600">${tp}%</td><td class="text-right"><span class="rag-dot ${tp>=100?'green':'red'}"></span></td></tr>`;
        tb.innerHTML = rows;
    }

    // Top wins
    if (latestData.topWins) {
        document.getElementById('topWinsTitle').textContent = latestLabel + ' Top Wins';
        document.getElementById('topWinsBody').innerHTML = latestData.topWins.map(w => `<tr><td style="font-weight:600">${w.name}</td><td style="color:#8b949e">${w.client}</td><td class="text-right currency" style="font-weight:600">${fmt(w.value)}</td></tr>`).join('');
    }

    document.getElementById('updatedStamp').textContent = 'Last updated: ' + (latestData.generated ? new Date(latestData.generated).toLocaleString('en-GB') : new Date().toLocaleString('en-GB'));
}

render();
</script>
</body>
</html>
